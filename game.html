<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Adventure</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            padding: 50px 20px;
        }
        .game-container {
            max-width: 600px;
            margin: 0 auto;
            border: 2px solid #00ff66;
            padding: 20px;
            border-radius: 10px;
            background-color: #000;
        }
        button {
            background-color: #00ff66;
            color: #000;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            margin: 10px 5px;
            cursor: pointer;
            border-radius: 5px;
        }
        button:hover {
            background-color: #00cc52;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <h1>The Haunted House</h1>
        <p id="story-text">You are standing in front of an old, abandoned house. The front door is slightly open.</p>
        
        <div id="choices">
            <button onclick="makeChoice(1)">Enter the House</button>
            <button onclick="makeChoice(2)">Turn Back</button>
        </div>
    </div>

    <script>
        function makeChoice(choice) {
            const storyText = document.getElementById('story-text');
            const choicesDiv = document.getElementById('choices');

            if (choice === 1) {
                storyText.innerText = "You step inside. The door slams shut behind you! You hear a noise upstairs.";
                choicesDiv.innerHTML = `
                    <button onclick="makeChoice(3)">Go Upstairs</button>
                    <button onclick="makeChoice(4)">Check the Basement</button>
                `;
            } else if (choice === 2) {
                storyText.innerText = "You decided it wasn't worth the risk and walked home safely. Game Over!";
                choicesDiv.innerHTML = `<button onclick="location.reload()">Play Again</button>`;
            } else if (choice === 3) {
                storyText.innerText = "You found a chest of gold on the top floor! You Win!";
                choicesDiv.innerHTML = `<button onclick="location.reload()">Play Again</button>`;
            } else if (choice === 4) {
                storyText.innerText = "It's too dark to see! You tripped and fell. Game Over!";
                choicesDiv.innerHTML = `<button onclick="location.reload()">Play Again</button>`;
            }
        }
    </script>

</body>
</html>
