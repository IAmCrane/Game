<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game</title>
    <style>
        body {
            background-color: #121212;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            padding: 50px 20px;
        }
        .game-card {
            max-width: 500px;
            margin: 0 auto;
            border: 2px solid #00ff66;
            padding: 30px;
            border-radius: 12px;
            background-color: #000000;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.2);
        }
        input[type="number"] {
            padding: 10px;
            font-size: 18px;
            width: 80px;
            text-align: center;
            border-radius: 5px;
            border: none;
            margin-right: 10px;
        }
        button {
            background-color: #00ff66;
            color: #000;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 5px;
        }
        button:hover { background-color: #00cc52; }
        .back-link {
            display: inline-block;
            margin-top: 20px;
            color: #ffffff;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="game-card">
        <h1>Guess the Secret Number</h1>
        <p>I am thinking of a number between 1 and 100.</p>
        
        <input type="number" id="guessInput" min="1" max="100">
        <button onclick="checkGuess()">Guess</button>

        <p id="feedback"></p>
        <p id="attempts">Attempts: 0</p>
    </div>

    <br>
    <a href="index.html" class="back-link">← Back to Arcade</a>

    <script>
        const secretNumber = Math.floor(Math.random() * 100) + 1;
        let attempts = 0;

        function checkGuess() {
            const guess = parseInt(document.getElementById('guessInput').value);
            const feedback = document.getElementById('feedback');
            const attemptsText = document.getElementById('attempts');

            if (isNaN(guess) || guess < 1 || guess > 100) {
                feedback.innerText = "Please enter a valid number between 1 and 100.";
                return;
            }

            attempts++;
            attemptsText.innerText = "Attempts: " + attempts;

            if (guess === secretNumber) {
                feedback.innerText = `🎉 You got it! The secret number was ${secretNumber}!`;
            } else if (guess < secretNumber) {
                feedback.innerText = "Too low! Try higher.";
            } else {
                feedback.innerText = "Too high! Try lower.";
            }
        }
    </script>

</body>
</html>
