<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <style>
        body {
            background-color: #0d0814;
            color: #d152ff;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            padding: 50px 20px;
        }
        .game-card {
            max-width: 500px;
            margin: 0 auto;
            border: 2px solid #b026ff;
            padding: 30px;
            border-radius: 12px;
            background-color: #120224;
            box-shadow: 0 0 20px rgba(176, 38, 255, 0.35);
        }
        h1 {
            color: #ffffff;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(209, 82, 255, 0.6);
        }
        p {
            color: #e2aeff;
            font-size: 16px;
        }
        button {
            background-color: #b026ff;
            color: #ffffff;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            margin: 8px;
            cursor: pointer;
            border-radius: 6px;
            transition: background 0.2s ease, box-shadow 0.2s ease;
        }
        button:hover {
            background-color: #8c00e6;
            box-shadow: 0 0 10px rgba(176, 38, 255, 0.6);
        }
        .score-board {
            margin-top: 20px;
            font-size: 18px;
            color: #ffffff;
        }
        .home-btn {
            display: inline-block;
            margin-top: 25px;
            color: #ffffff;
            text-decoration: none;
            font-size: 16px;
            border: 1px solid #b026ff;
            padding: 8px 18px;
            border-radius: 6px;
            transition: background 0.2s ease, color 0.2s ease;
        }
        .home-btn:hover {
            background-color: #b026ff;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="game-card">
        <h1>Rock, Paper, Scissors</h1>
        <p>Choose your move against the computer!</p>

        <div>
            <button onclick="play('Rock')">✊ Rock</button>
            <button onclick="play('Paper')">✋ Paper</button>
            <button onclick="play('Scissors')">✌️ Scissors</button>
        </div>

        <p id="result" style="font-size: 18px; margin-top: 20px; min-height: 24px;"></p>

        <div class="score-board">
            Score — You: <span id="playerScore">0</span> | Computer: <span id="compScore">0</span>
        </div>
    </div>

    <!-- Home Page Button -->
    <a href="index.html" class="home-btn">← Back to Arcade</a>

    <script>
        let playerScore = 0;
        let compScore = 0;
        const choices = ['Rock', 'Paper', 'Scissors'];

        function play(playerChoice) {
            const compChoice = choices[Math.floor(Math.random() * 3)];
            let resultText = `You picked ${playerChoice}, Computer picked ${compChoice}. `;

            if (playerChoice === compChoice) {
                resultText += "It's a tie!";
            } else if (
                (playerChoice === 'Rock' && compChoice === 'Scissors') ||
                (playerChoice === 'Paper' && compChoice === 'Rock') ||
                (playerChoice === 'Scissors' && compChoice === 'Paper')
            ) {
                resultText += "You win this round! 🎉";
                playerScore++;
            } else {
                resultText += "Computer wins this round! 🤖";
                compScore++;
            }

            document.getElementById('result').innerText = resultText;
            document.getElementById('playerScore').innerText = playerScore;
            document.getElementById('compScore').innerText = compScore;
        }
    </script>

</body>
</html>
