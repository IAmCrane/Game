<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Number Guessing Game</title>
    <style>
        body {
            background-color: #0d0814;
            color: #d152ff;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            padding: 50px 20px;
        }
        .game-card {
            max-width: 500px;
            margin: 0 auto;
            border: 2px solid #b026ff;
            padding: 30px;
            border-radius: 12px;
            background-color: #120224;
            box-shadow: 0 0 20px rgba(176, 38, 255, 0.35);
        }
        h1 {
            color: #ffffff;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(209, 82, 255, 0.6);
        }
        p {
            color: #e2aeff;
            font-size: 16px;
        }
        input[type="number"] {
            padding: 10px;
            font-size: 18px;
            width: 80px;
            text-align: center;
            border-radius: 6px;
            border: 1px solid #b026ff;
            background-color: #0d0814;
            color: #ffffff;
            margin-right: 10px;
            outline: none;
        }
        button {
            background-color: #b026ff;
            color: #ffffff;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
            transition: background 0.2s ease, box-shadow 0.2s ease;
        }
        button:hover {
            background-color: #8c00e6;
            box-shadow: 0 0 10px rgba(176, 38, 255, 0.6);
        }
        #feedback {
            font-size: 18px;
            font-weight: bold;
            margin-top: 20px;
            min-height: 24px;
        }
        #attempts {
            color: #a370dc;
            font-size: 14px;
        }
        .home-btn {
            display: inline-block;
            margin-top: 25px;
            color: #ffffff;
            text-decoration: none;
            font-size: 16px;
            border: 1px solid #b026ff;
            padding: 8px 18px;
            border-radius: 6px;
            transition: background 0.2s ease, color 0.2s ease;
        }
        .home-btn:hover {
            background-color: #b026ff;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="game-card">
        <h1>Guess the Secret Number</h1>
        <p>I am thinking of a number between 1 and 100.</p>
        
        <div style="margin-top: 20px;">
            <input type="number" id="guessInput" min="1" max="100">
            <button onclick="checkGuess()">Guess</button>
        </div>

        <p id="feedback"></p>
        <p id="attempts">Attempts: 0</p>
    </div>

    <!-- Home Page Button -->
    <a href="index.html" class="home-btn">← Back to Arcade</a>

    <script>
        const secretNumber = Math.floor(Math.random() * 100) + 1;
        let attempts = 0;

        function checkGuess() {
            const guess = parseInt(document.getElementById('guessInput').value);
            const feedback = document.getElementById('feedback');
            const attemptsText = document.getElementById('attempts');

            if (isNaN(guess) || guess < 1 || guess > 100) {
                feedback.innerText = "Please enter a valid number between 1 and 100.";
                return;
            }

            attempts++;
            attemptsText.innerText = "Attempts: " + attempts;

            if (guess === secretNumber) {
                feedback.innerText = `🎉 You got it! The secret number was ${secretNumber}!`;
            } else if (guess < secretNumber) {
                feedback.innerText = "Too low! Try higher.";
            } else {
                feedback.innerText = "Too high! Try lower.";
            }
        }
    </script>

</body>
</html>
