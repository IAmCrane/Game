<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bear with a Backpack</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #2e3d29;
            color: #f0f4f1;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        #game-container {
            background-color: #1e291b;
            border: 2px solid #4a6b40;
            border-radius: 12px;
            padding: 24px;
            width: 90%;
            max-width: 500px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.5);
            text-align: center;
        }

        #stats-bar {
            display: flex;
            justify-content: space-around;
            background-color: #2e3d29;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-weight: bold;
        }

        #story-text {
            min-height: 100px;
            margin-bottom: 20px;
            line-height: 1.5;
            white-space: pre-line;
        }

        #interactive-area button {
            background-color: #4a6b40;
            color: white;
            border: none;
            padding: 10px 16px;
            margin: 6px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 14px;
            transition: background-color 0.2s;
        }

        #interactive-area button:hover {
            background-color: #638c56;
        }

        #interactive-area input {
            padding: 8px 12px;
            border-radius: 4px;
            border: 1px solid #ccc;
            font-size: 14px;
        }
    </style>
</head>
<body>

<div id="game-container">
    <div id="stats-bar">
        <div>❤️ Health: <span id="healthDisplay">5</span>/5</div>
        <div>🔋 Hunger: <span id="hungerDisplay">5</span>/5</div>
        <div>🎒 Backpack: <span id="inventoryDisplay">Empty</span></div>
    </div>

    <div id="story-text">You are a bear with a backpack. Welcome to the forest!</div>

    <div id="interactive-area">
        <button onclick="askName()">Begin Adventure 🐻</button>
    </div>
</div>

<script>
    // --- STATE VARIABLES ---
    let health = 5;
    let hunger = 5;
    let moveCount = 0; // Tracks movements to trigger hunger drop
    let playerName = "";
    let playerLocation = "";
    let inventory = []; // Array of objects: { name: "Apple", count: 1 }

    // --- INVENTORY STACKING HELPERS ---
    function addItem(name) {
        const item = inventory.find(i => i.name === name);
        if (item) {
            item.count += 1;
        } else {
            inventory.push({ name: name, count: 1 });
        }
    }

    function removeItem(name) {
        const itemIndex = inventory.findIndex(i => i.name === name);
        if (itemIndex !== -1) {
            inventory[itemIndex].count -= 1;
            if (inventory[itemIndex].count <= 0) {
                inventory.splice(itemIndex, 1);
            }
        }
    }

    function getItemCount(name) {
        const item = inventory.find(i => i.name === name);
        return item ? item.count : 0;
    }

    // --- UI UPDATES ---
    function updateUI() {
        document.getElementById('healthDisplay').innerText = health;
        document.getElementById('hungerDisplay').innerText = hunger;
        const invDisplay = document.getElementById('inventoryDisplay');
        
        if (inventory.length === 0) {
            invDisplay.innerHTML = "Empty";
            return;
        }

        invDisplay.innerHTML = inventory.map(item => {
            const label = item.count > 1 ? `${item.count}x ${item.name}` : item.name;
            if (item.name === "Apple" || item.name === "Cod Fish" || item.name === "Berry") {
                return `<button onclick="useItem('${item.name}')" style="padding:2px 6px; margin:2px; font-size:12px;">🍎 Eat ${label}</button>`;
            }
            return `<span style="margin:2px;">${label}</span>`;
        }).join(" | ");
    }

    // --- HUNGER STEP COUNTER ---
    function trackMovement() {
        moveCount++;
        let hungerNotice = "";

        if (moveCount % 3 === 0) {
            if (hunger > 0) {
                hunger -= 1;
                hungerNotice = "\n\n⚠️ You feel hungry from traveling... (Hunger -1)";
            } else {
                health -= 1;
                hungerNotice = "\n\n💀 You are starving! (Health -1)";
            }
            updateUI();
        }
        return hungerNotice;
    }

    // --- CONSUMABLE ITEM USE ---
    function useItem(itemName) {
        if (itemName === "Apple") {
            if (getItemCount("Apple") > 0) {
                removeItem("Apple");
                health = Math.min(5, health + 1);
                hunger = Math.min(5, hunger + 1);
                updateUI();
                document.getElementById('story-text').innerText = 
                    "🍎 You ate a crisp, delicious Apple from your backpack!\n\n❤️ Health +1 | 🔋 Hunger +1";
            }
        } else if (itemName === "Cod Fish") {
            if (getItemCount("Cod Fish") > 0) {
                removeItem("Cod Fish");
                health = Math.min(5, health + 2);
                hunger = Math.min(5, hunger + 2);
                updateUI();
                document.getElementById('story-text').innerText = 
                    "🐟 You ate a cooked Cod Fish!\n\n❤️ Health +2 | 🔋 Hunger +2";
            }
        } else if (itemName === "Berry") {
            if (getItemCount("Berry") > 0) {
                removeItem("Berry");
                health = Math.min(5, health + 1);
                hunger = Math.min(5, hunger + 1);
                updateUI();
                document.getElementById('story-text').innerText = 
                    "🫐 You snacked on a Berry from your backpack!\n\n❤️ Health +1 | 🔋 Hunger +1";
            }
        }
    }

    function checkGameOver() {
        if (health <= 0) {
            document.getElementById('story-text').innerText = "💀 You ran out of health and collapsed in the woods... GAME OVER!";
            document.getElementById('interactive-area').innerHTML = `
                <button onclick="location.reload()">Try Again 🔄</button>
            `;
            return true;
        }
        return false;
    }

    // --- INTRO FLOW ---
    function askName() {
        document.getElementById('story-text').innerText = "What is your name, bear?";
        const interactiveArea = document.getElementById('interactive-area');
        interactiveArea.innerHTML = `
            <input type="text" id="userInput" placeholder="Enter your name...">
            <br><br>
            <button onclick="submitName()">Submit</button>
        `;
    }

    function submitName() {
        const inputField = document.getElementById('userInput');
        playerName = inputField && inputField.value.trim() !== "" ? inputField.value.trim() : "Bear";

        document.getElementById('story-text').innerText = 
            `That's a nice name but all i heard was GRRRRR.\n\nWhere are you from?`;

        const interactiveArea = document.getElementById('interactive-area');
        interactiveArea.innerHTML = `
            <input type="text" id="userInput" placeholder="Enter location...">
            <br><br>
            <button onclick="submitLocation()">Submit</button>
        `;
    }

    function submitLocation() {
        const inputField = document.getElementById('userInput');
        playerLocation = inputField && inputField.value.trim() !== "" ? inputField.value.trim() : "the forest";

        document.getElementById('story-text').innerText = 
            `So what I'm getting is, your name is GRRRRR, and you are from INCOMPREHENSIBLE GROWL.\n\n` +
            `You are in a forest clearing. There is a cave, a pond and two paths.\n\n` +
            `You can go down the left path, the right path, go in the cave, or go to the pond.`;

        showMainChoices();
    }

    function showMainChoices() {
        if (checkGameOver()) return;
        const interactiveArea = document.getElementById('interactive-area');
        interactiveArea.innerHTML = `
            <button onclick="goLeft()">Left Path ⬅️</button>
            <button onclick="goRight()">Right Path ➡️</button>
            <button onclick="enterCave()">Go in Cave 🦇</button>
            <button onclick="visitLake()">Go to Pond 🌊</button>
        `;
    }

    // --- LEFT PATH ---
    function goLeft() {
        const hungerMsg = trackMovement();
        if (checkGameOver()) return;

        const roll = Math.random();

        if (roll < 0.35) {
            inspectApple(hungerMsg);
        } else if (roll < 0.70) {
            encounterKnight(hungerMsg);
        } else {
            document.getElementById('story-text').innerText = 
                "You walk along the left path. The forest is peaceful and quiet... nothing happens." + hungerMsg;
            
            const interactiveArea = document.getElementById('interactive-area');
            interactiveArea.innerHTML = `
                <button onclick="showMainChoices()">Back to Clearing 🔙</button>
            `;
        }
    }

    function inspectApple(hungerMsg = "") {
        const isGoodApple = Math.random() < 0.5;

        if (isGoodApple) {
            addItem("Apple");
            updateUI();
            document.getElementById('story-text').innerText = 
                "You find a fresh, juicy red Apple! You put it in your backpack for later." + hungerMsg;
        } else {
            addItem("Worm");
            updateUI();
            document.getElementById('story-text').innerText = 
                "You find an apple, but it's full of wriggling worms! You break off a Worm and put it in your backpack." + hungerMsg;
        }

        const interactiveArea = document.getElementById('interactive-area');
        interactiveArea.innerHTML = `
            <button onclick="showMainChoices()">Back to Clearing 🔙</button>
        `;
    }

    function encounterKnight(hungerMsg = "") {
        document.getElementById('story-text').innerText = 
            "A shiny knight steps out from behind an oak tree! 'Halt, Bear!' he yells, drawing his sword." + hungerMsg;
        
        const interactiveArea = document.getElementById('interactive-area');
        interactiveArea.innerHTML = `
            <button onclick="fightKnight()">Fight the Knight ⚔️</button>
            <button onclick="runFromKnight()">Run Away 🏃</button>
        `;
    }

    function fightKnight() {
        const playerWins = Math.random() < 0.5;

        if (playerWins) {
            addItem("String");
            updateUI();
            document.getElementById('story-text').innerText = 
                "ROAR! You let out a mighty growl and defeat the knight! He flees, dropping a piece of String on the ground. You put it in your backpack.";
        } else {
            health -= 1;
            updateUI();
            if (checkGameOver()) return;
            document.getElementById('story-text').innerText = 
                "You try to fight, but the knight strikes you with his sword! You lose a heart.\n\n❤️ Health -1";
        }

        const interactiveArea = document.getElementById('interactive-area');
        interactiveArea.innerHTML = `
            <button onclick="showMainChoices()">Back to Clearing 🔙</button>
        `;
    }

    function runFromKnight() {
        const gotAway = Math.random() < 0.5;

        if (gotAway) {
            document.getElementById('story-text').innerText = 
                "You turn around and sprint into the brush. You manage to escape safely!";
        } else {
            health -= 1;
            updateUI();
            if (checkGameOver()) return;
            document.getElementById('story-text').innerText = 
                "You try to run away, but you trip over a root and the knight strikes you before you escape! You lose a heart.\n\n❤️ Health -1";
        }

        const interactiveArea = document.getElementById('interactive-area');
        interactiveArea.innerHTML = `
            <button onclick="showMainChoices()">Back to Clearing 🔙</button>
        `;
    }

    // --- RIGHT PATH ---
    function goRight() {
        const hungerMsg = trackMovement();
        if (checkGameOver()) return;

        const roll = Math.random();

        if (roll < 0.30) {
            stepInTrap(hungerMsg);
        } else if (roll < 0.60) {
            findStick(hungerMsg);
        } else if (roll < 0.85) {
            findBerryBush(hungerMsg);
        } else {
            document.getElementById('story-text').innerText = 
                "You stroll down the right path. The wind rustles through the leaves, but the trail is quiet." + hungerMsg;
            
            const interactiveArea = document.getElementById('interactive-area');
            interactiveArea.innerHTML = `
                <button onclick="visitLake()">Go to Pond 🌊</button>
                <button onclick="showMainChoices()">Back to Clearing 🔙</button>
            `;
        }
    }

    function stepInTrap(hungerMsg = "") {
        health -= 1;
        updateUI();
        if (checkGameOver()) return;

        document.getElementById('story-text').innerText = 
            "SNAP! You step directly into a hidden bear trap and take damage!\n\n❤️ Health -1" + hungerMsg;
        
        const interactiveArea = document.getElementById('interactive-area');
        interactiveArea.innerHTML = `
            <button onclick="visitLake()">Go to Pond 🌊</button>
            <button onclick="showMainChoices()">Back to Clearing 🔙</button>
        `;
    }

    function findStick(hungerMsg = "") {
        addItem("Stick");
        updateUI();
        document.getElementById('story-text').innerText = 
            "You spot a long, sturdy branch lying near the path. You tuck the Stick into your backpack!" + hungerMsg;

        const interactiveArea = document.getElementById('interactive-area');
        interactiveArea.innerHTML = `
            <button onclick="visitLake()">Go to Pond 🌊</button>
            <button onclick="showMainChoices()">Back to Clearing 🔙</button>
        `;
    }

    function findBerryBush(hungerMsg = "") {
        addItem("Berry");
        hunger = Math.min(5, hunger + 1);
        health = Math.min(5, health + 1);
        updateUI();
        document.getElementById('story-text').innerText = 
            "You find a lush berry bush filled with sweet berries! You eat one and put another in your backpack.\n\n❤️ Health +1 | 🔋 Hunger +1" + hungerMsg;

        const interactiveArea = document.getElementById('interactive-area');
        interactiveArea.innerHTML = `
            <button onclick="visitLake()">Go to Pond 🌊</button>
            <button onclick="showMainChoices()">Back to Clearing 🔙</button>
        `;
    }

    // --- CAVE ---
    function enterCave() {
        const hungerMsg = trackMovement();
        if (checkGameOver()) return;

        const hasLanternFish = getItemCount("Lantern Fish") > 0;

        if (hasLanternFish) {
            document.getElementById('story-text').innerText = 
                "You step into the dark cave, and your Lantern Fish glows brilliantly in the dark!\n\n" +
                "Deep inside the cavern, you spot a glowing pedestal with a delicious Birthday Cake 🎂 on top!\n\n" +
                "🎉 YOU FOUND THE BIRTHDAY CAKE! CONGRATULATIONS, YOU WON THE GAME! 🎉";
            
            const interactiveArea = document.getElementById('interactive-area');
            interactiveArea.innerHTML = `
                <button onclick="location.reload()">Play Again 🔄</button>
            `;
        } else {
            document.getElementById('story-text').innerText = 
                "You step into the cave, but it is way too dark to see anything! You decide to leave and head back to the clearing." + hungerMsg;
            
            const interactiveArea = document.getElementById('interactive-area');
            interactiveArea.innerHTML = `
                <button onclick="showMainChoices()">Back to Clearing 🔙</button>
            `;
        }
    }

    // --- POND / FISHING LOGIC ---
    function visitLake() {
        const hungerMsg = trackMovement();
        if (checkGameOver()) return;

        const hasWorm = getItemCount("Worm") > 0;
        const hasString = getItemCount("String") > 0;
        const hasStick = getItemCount("Stick") > 0;
        const hasBerry = getItemCount("Berry") > 0;

        if (hasWorm && hasString && hasStick && hasBerry) {
            removeItem("Worm");
            removeItem("String");
            removeItem("Stick");
            removeItem("Berry");
            addItem("Lantern Fish");
            hunger = Math.min(5, hunger + 3);
            health = Math.min(5, health + 2);
            updateUI();

            document.getElementById('story-text').innerText = 
                "You reach the pond with your Stick, String, Worm, and a Berry!\n\n" +
                "You assemble a makeshift rod, bait the hook with the berry and worm, and cast out...\n\n" +
                "🎣 SPLASH! You caught a rare Lantern Fish! It glows brightly in the dark! 🐟✨" + hungerMsg;

        } else if (hasWorm && hasString && hasStick) {
            removeItem("Worm");
            removeItem("String");
            removeItem("Stick");
            addItem("Cod Fish");
            hunger = Math.min(5, hunger + 2);
            health = Math.min(5, health + 2);
            updateUI();

            document.getElementById('story-text').innerText = 
                "You reach the pond with your Stick, String, and Worm.\n\n" +
                "You construct a fishing pole and cast your line...\n\n" +
                "🎣 You caught a fresh Cod Fish! 🐟" + hungerMsg;

        } else if (getItemCount("Lantern Fish") > 0 || getItemCount("Cod Fish") > 0) {
            document.getElementById('story-text').innerText = 
                "You stand by the quiet pond, but you've already fished here." + hungerMsg;
        } else {
            let missing = [];
            if (!hasStick) missing.push("Stick");
            if (!hasString) missing.push("String (from the Knight)");
            if (!hasWorm) missing.push("Worm (from an Apple)");

            document.getElementById('story-text').innerText = 
                "You arrive at the quiet pond. There is nothing to do right now...\n\n" +
                "You still need: " + missing.join(", ") + " to fish!" + hungerMsg;
        }

        const interactiveArea = document.getElementById('interactive-area');
        interactiveArea.innerHTML = `
            <button onclick="showMainChoices()">Back to Clearing 🔙</button>
        `;
    }
</script>

</body>
</html>
