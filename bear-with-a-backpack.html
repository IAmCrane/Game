<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bear with a Backpack</title>
    <style>
        body {
            background-color: #0d0814;
            color: #d152ff;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            padding: 50px 20px;
        }
        .game-card {
            max-width: 600px;
            margin: 0 auto;
            border: 2px solid #b026ff;
            padding: 30px;
            border-radius: 12px;
            background-color: #120224;
            box-shadow: 0 0 20px rgba(176, 38, 255, 0.35);
        }
        h1 {
            color: #ffffff;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(209, 82, 255, 0.6);
        }
        p {
            font-size: 18px;
            line-height: 1.5;
            min-height: 60px;
            color: #e2aeff;
        }
        .button-group {
            margin-top: 30px;
        }
        button {
            background-color: #b026ff;
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            margin: 8px;
            cursor: pointer;
            border-radius: 6px;
            transition: background 0.2s ease, box-shadow 0.2s ease;
        }
        button:hover {
            background-color: #8c00e6;
            box-shadow: 0 0 10px rgba(176, 38, 255, 0.6);
        }
        .home-btn {
            display: inline-block;
            margin-top: 25px;
            color: #ffffff;
            text-decoration: none;
            font-size: 16px;
            border: 1px solid #b026ff;
            padding: 8px 18px;
            border-radius: 6px;
            transition: background 0.2s ease, color 0.2s ease;
        }
        .home-btn:hover {
            background-color: #b026ff;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="game-card">
        <h1>Bear with a Backpack</h1>
        <p id="story-text">You are a bear packing your backpack for a forest adventure. What do you pack first?</p>
        
        <div id="choices" class="button-group">
            <button onclick="makeChoice(1)">Pack Honey Jar 🍯</button>
            <button onclick="makeChoice(2)">Pack Compass 🧭</button>
        </div>
    </div>

    <!-- Home Page Button -->
    <a href="index.html" class="home-btn">← Back to Arcade</a>

    <script>
        function makeChoice(choice) {
            const storyText = document.getElementById('story-text');
            const choicesDiv = document.getElementById('choices');

            if (choice === 1) {
                storyText.innerText = "You packed the honey! A wild swarm of bees spots you in the forest.";
                choicesDiv.innerHTML = `
                    <button onclick="makeChoice(3)">Share the honey</button>
                    <button onclick="makeChoice(4)">Run away!</button>
                `;
            } else if (choice === 2) {
                storyText.innerText = "You used the compass to navigate straight to the mountain peak! You Win!";
                choicesDiv.innerHTML = `<button onclick="location.reload()">Play Again</button>`;
            } else if (choice === 3) {
                storyText.innerText = "The bees become your friends and guide you to the giant honey cave! You Win!";
                choicesDiv.innerHTML = `<button onclick="location.reload()">Play Again</button>`;
            } else if (choice === 4) {
                storyText.innerText = "You tripped while running! Game Over!";
                choicesDiv.innerHTML = `<button onclick="location.reload()">Play Again</button>`;
            }
        }
    </script>

</body>
</html>
