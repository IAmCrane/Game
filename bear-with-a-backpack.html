<script>
        // Player Stats & Inventory
        let health = 3;
        let hunger = 3;
        let playerName = "";
        let playerLocation = "";
        let inventory = [];

        function updateUI() {
            document.getElementById('healthDisplay').innerText = health;
            document.getElementById('hungerDisplay').innerText = hunger;
            
            const invDisplay = document.getElementById('inventoryDisplay');
            if (inventory.length === 0) {
                invDisplay.innerText = "Empty";
            } else {
                invDisplay.innerText = inventory.join(", ");
            }
        }

        function checkGameOver() {
            if (health <= 0) {
                document.getElementById('story-text').innerText = "💀 You ran out of health and collapsed in the woods... GAME OVER!";
                document.getElementById('interactive-area').innerHTML = `<button onclick="location.reload()">Try Again</button>`;
                return true;
            }
            return false;
        }

        function submitName() {
            const inputField = document.getElementById('userInput');
            playerName = inputField && inputField.value.trim() !== "" ? inputField.value.trim() : "Bear";
            
            document.getElementById('story-text').innerText = `Hello, ${playerName}! Where are you from?`;
            
            const interactiveArea = document.getElementById('interactive-area');
            interactiveArea.innerHTML = `
                <input type="text" id="userInput" placeholder="Enter location...">
                <br>
                <button onclick="submitLocation()">Submit</button>
            `;
        }

        function submitLocation() {
            const inputField = document.getElementById('userInput');
            playerLocation = inputField && inputField.value.trim() !== "" ? inputField.value.trim() : "the forest";
            
            document.getElementById('story-text').innerText = `So your name is ${playerName} and you are from ${playerLocation}.\n\nYou stand at a crossroads in the forest. Which way do you want to head?`;
            
            showMainChoices();
        }

        function showMainChoices() {
            if (checkGameOver()) return;

            const interactiveArea = document.getElementById('interactive-area');
            interactiveArea.innerHTML = `
                <button onclick="goLeft()">Walk Left ⬅️</button>
                <button onclick="goRight()">Walk Right ➡️</button>
            `;
        }

        // --- LEFT PATH BRANCHES ---
        function goLeft() {
            document.getElementById('story-text').innerText = "You venture down the left path into dense trees. What do you search for?";
            
            const interactiveArea = document.getElementById('interactive-area');
            interactiveArea.innerHTML = `
                <button onclick="inspectApple()">Look for an Apple 🍎</button>
                <button onclick="encounterKnight()">Challenge the Knight ⚔️</button>
                <button onclick="showMainChoices()">Back to Crossroads 🔙</button>
            `;
        }

        function inspectApple() {
            const isGoodApple = Math.random() < 0.5;

            if (isGoodApple) {
                health = Math.min(3, health + 1);
                hunger = Math.min(5, hunger + 1);
                updateUI();
                document.getElementById('story-text').innerText = "You find a juicy red apple! You eat it happily.\n\n❤️ Health +1 | 🔋 Hunger +1";
            } else {
                if (!inventory.includes("Worm")) {
                    inventory.push("Worm");
                }
                updateUI();
                document.getElementById('story-text').innerText = "You find an apple, but it's full of wriggling worms! You break off a worm and put it in your backpack.";
            }

            const interactiveArea = document.getElementById('interactive-area');
            interactiveArea.innerHTML = `<button onclick="goLeft()">Continue Left</button>`;
        }

        function encounterKnight() {
            document.getElementById('story-text').innerText = "A shiny knight steps out from behind an oak tree! 'Halt, Bear!' he yells, drawing his sword.";
            
            const interactiveArea = document.getElementById('interactive-area');
            interactiveArea.innerHTML = `
                <button onclick="fightKnight()">Fight the Knight 🐻</button>
                <button onclick="goLeft()">Run Away 🏃</button>
            `;
        }

        function fightKnight() {
            const playerWins = Math.random() < 0.5;

            if (playerWins) {
                if (!inventory.includes("String")) {
                    inventory.push("String");
                }
                updateUI();
                document.getElementById('story-text').innerText = "ROAR! You let out a mighty growl and charge! The terrified knight runs away, dropping a piece of String on the ground. You put the String in your backpack.";
            } else {
                health -= 1;
                updateUI();
                if (checkGameOver()) return;
                document.getElementById('story-text').innerText = "The knight strikes you with the flat of his blade! You take damage before backing off.\n\n❤️ Health -1";
            }

            const interactiveArea = document.getElementById('interactive-area');
            interactiveArea.innerHTML = `<button onclick="goLeft()">Continue Left</button>`;
        }

        // --- RIGHT PATH BRANCHES ---
        function goRight() {
            document.getElementById('story-text').innerText = "You trek down the right path toward the river sound. What do you do?";
            
            const interactiveArea = document.getElementById('interactive-area');
            interactiveArea.innerHTML = `
                <button onclick="stepInTrap()">Explore the Bushes 🌿</button>
                <button onclick="findStick()">Search for a Stick 🪵</button>
                <button onclick="visitLake()">Head to the Lake 🌊</button>
                <button onclick="showMainChoices()">Back to Crossroads 🔙</button>
            `;
        }

        function stepInTrap() {
            health -= 1;
            updateUI();
            if (checkGameOver()) return;

            document.getElementById('story-text').innerText = "SNAP! You step directly into a hidden bear trap!\n\n❤️ Health -1";
            
            const interactiveArea = document.getElementById('interactive-area');
            interactiveArea.innerHTML = `<button onclick="goRight()">Continue Right</button>`;
        }

        function findStick() {
            if (!inventory.includes("Stick")) {
                inventory.push("Stick");
                updateUI();
                document.getElementById('story-text').innerText = "You find a sturdy, flexible tree branch on the path and tuck the Stick into your backpack!";
            } else {
                document.getElementById('story-text').innerText = "You look around, but you already have a great stick in your backpack.";
            }

            const interactiveArea = document.getElementById('interactive-area');
            interactiveArea.innerHTML = `<button onclick="goRight()">Continue Right</button>`;
        }

        function visitLake() {
            const hasWorm = inventory.includes("Worm");
            const hasString = inventory.includes("String");
            const hasStick = inventory.includes("Stick");

            if (hasWorm && hasString && hasStick) {
                inventory = inventory.filter(item => item !== "Worm" && item !== "String" && item !== "Stick");
                inventory.push("Fishing Rod");
                hunger = Math.min(5, hunger + 2);
                updateUI();

                document.getElementById('story-text').innerText = "You reach a beautiful, quiet lake. You open your backpack and combine your Stick, String, and Worm to craft a Fishing Rod!\n\nYou cast your line and catch a big fish! 🐟\n\n🔋 Hunger +2";
            } else if (inventory.includes("Fishing Rod")) {
                hunger = Math.min(5, hunger + 1);
                updateUI();
                document.getElementById('story-text').innerText = "You sit at the lake with your Fishing Rod and catch another fresh fish!\n\n🔋 Hunger +1";
            } else {
                let missing = [];
                if (!hasStick) missing.push("Stick");
                if (!hasString) missing.push("String");
                if (!hasWorm) missing.push("Worm");

                document.getElementById('story-text').innerText = "You arrive at a clear blue lake. It looks like a great spot to fish, but you still need: " + missing.join(", ") + " to make a fishing rod!";
            }

            const interactiveArea = document.getElementById('interactive-area');
            interactiveArea.innerHTML = `<button onclick="goRight()">Continue Right</button>`;
        }
    </script>
