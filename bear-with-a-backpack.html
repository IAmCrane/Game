<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bear with a Backpack</title>
    <style>
        body {
            background-color: #0d0814;
            color: #d152ff;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            padding: 50px 20px;
        }
        .game-card {
            max-width: 600px;
            margin: 0 auto;
            border: 2px solid #b026ff;
            padding: 30px;
            border-radius: 12px;
            background-color: #120224;
            box-shadow: 0 0 20px rgba(176, 38, 255, 0.35);
        }
        h1 {
            color: #ffffff;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(209, 82, 255, 0.6);
        }
        .stats-bar {
            display: flex;
            justify-content: space-around;
            background-color: #0d0814;
            border: 1px solid #b026ff;
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 20px;
            color: #ffffff;
            font-weight: bold;
        }
        p {
            font-size: 18px;
            line-height: 1.5;
            min-height: 60px;
            color: #e2aeff;
        }
        input[type="text"] {
            padding: 10px;
            font-size: 16px;
            border-radius: 6px;
            border: 1px solid #b026ff;
            background-color: #0d0814;
            color: #ffffff;
            margin-bottom: 15px;
            outline: none;
            text-align: center;
            width: 80%;
            max-width: 300px;
        }
        .button-group {
            margin-top: 20px;
        }
        button {
            background-color: #b026ff;
            color: #ffffff;
            border: none;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            margin: 8px;
            cursor: pointer;
            border-radius: 6px;
            transition: background 0.2s ease, box-shadow 0.2s ease;
        }
        button:hover {
            background-color: #8c00e6;
            box-shadow: 0 0 10px rgba(176, 38, 255, 0.6);
        }
        .home-btn {
            display: inline-block;
            margin-top: 25px;
            color: #ffffff;
            text-decoration: none;
            font-size: 16px;
            border: 1px solid #b026ff;
            padding: 8px 18px;
            border-radius: 6px;
            transition: background 0.2s ease, color 0.2s ease;
        }
        .home-btn:hover {
            background-color: #b026ff;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="game-card">
        <h1>Bear with a Backpack</h1>

        <!-- Live Stats Display -->
        <div class="stats-bar">
            <span>❤️ Health: <span id="healthDisplay">3</span>/3</span>
            <span>🔋 Hunger: <span id="hungerDisplay">3</span>/5</span>
        </div>
        
        <p id="story-text">Hello and welcome to the forest! What is your name?</p>
        
        <div id="interactive-area">
            <input type="text" id="userInput" placeholder="Enter your name...">
            <br>
            <button onclick="submitName()">Submit</button>
        </div>
    </div>

    <!-- Home Page Button -->
    <a href="index.html" class="home-btn">← Back to Arcade</a>

    <script>
        // Game State Stats
        let health = 3;
        let hunger = 3;
        let playerName = "";
        let playerLocation = "";

        function updateStats() {
            document.getElementById('healthDisplay').innerText = health;
            document.getElementById('hungerDisplay').innerText = hunger;
        }

        function submitName() {
            const input = document.getElementById('userInput').value;
            playerName = input.trim() !== "" ? input : "Bear";
            
            const storyText = document.getElementById('story-text');
            storyText.innerText = "Thats a nice name, but all I heard was GRRRRR.\n\nWhere are you from?";
            
            document.getElementById('userInput').value = "";
            document.getElementById('userInput').placeholder = "Enter your location...";
            
            const interactiveArea = document.getElementById('interactive-area');
            interactiveArea.innerHTML = `
                <input type="text" id="userInput" placeholder="Enter location...">
                <br>
                <button onclick="submitLocation()">Submit</button>
            `;
        }

        function submitLocation() {
            const storyText = document.getElementById('story-text');
            storyText.innerText = "So what I'm getting is, your name is GRRRRR and you are from INCOMPREHENSIBLE GROWL.\n\nWhat do you want to do first?";
            
            const interactiveArea = document.getElementById('interactive-area');
            interactiveArea.innerHTML = `
                <button onclick="choosePath('left')">Go Left ⬅️</button>
                <button onclick="choosePath('right')">Go Right ➡️</button>
                <button onclick="choosePath('stay')">Stand Still 🛑</button>
            `;
        }

        function choosePath(choice) {
            const storyText = document.getElementById('story-text');
            const interactiveArea = document.getElementById('interactive-area');

            if (choice === 'left') {
                hunger = hunger + 1;
                updateStats();
                storyText.innerText = "You walk a few steps to the left and find an apple on the ground.\n\nCongratulations, GRRRRR! You eat the apple.\n🔋 Hunger is now: " + hunger + "/5";
            } else if (choice === 'right') {
                health = health - 1;
                updateStats();
                storyText.innerText = "You walk a few feet to the right and step in a bear trap!\n\n❤️ Health is now: " + health + "/3";
            } else {
                health = health - 1;
                updateStats();
                storyText.innerText = "You stood still for too long and got bit by a mosquito.\n\n❤️ Health is now: " + health + "/3";
            }

            interactiveArea.innerHTML = `<button onclick="location.reload()">Play Again</button>`;
        }
    </script>

</body>
</html>
