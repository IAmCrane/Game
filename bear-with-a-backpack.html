<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bear with a Backpack</title>
    <style>
        body {
            background-color: #0d0814;
            color: #d152ff;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            padding: 50px 20px;
        }
        .game-card {
            max-width: 600px;
            margin: 0 auto;
            border: 2px solid #b026ff;
            padding: 30px;
            border-radius: 12px;
            background-color: #120224;
            box-shadow: 0 0 20px rgba(176, 38, 255, 0.35);
        }
        h1 {
            color: #ffffff;
            margin-bottom: 20px;
            text-shadow: 0 0 10px rgba(209, 82, 255, 0.6);
        }
        .stats-bar {
            display: flex;
            justify-content: space-around;
            background-color: #0d0814;
            border: 1px solid #b026ff;
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 15px;
            color: #ffffff;
            font-weight: bold;
        }
        .inventory-bar {
            background-color: #0d0814;
            border: 1px dashed #b026ff;
            border-radius: 6px;
            padding: 10px;
            margin-bottom: 20px;
            color: #e2aeff;
            font-size: 15px;
        }
        p {
            font-size: 18px;
            line-height: 1.5;
            min-height: 60px;
            color: #e2aeff;
        }
        input[type="text"] {
            padding: 10px;
            font-size: 16px;
            border-radius: 6px;
            border: 1px solid #b026ff;
            background-color: #0d0814;
            color: #ffffff;
            margin-bottom: 15px;
            outline: none;
            text-align: center;
            width: 80%;
            max-width: 300px;
        }
        button {
            background-color: #b026ff;
            color: #ffffff;
            border: none;
            padding: 12px 20px;
            font-size: 15px;
            font-weight: bold;
            margin: 6px;
            cursor: pointer;
            border-radius: 6px;
            transition: background 0.2s ease, box-shadow 0.2s ease;
        }
        button:hover {
            background-color: #8c00e6;
            box-shadow: 0 0 10px rgba(176, 38, 255, 0.6);
        }
        .home-btn {
            display: inline-block;
            margin-top: 25px;
            color: #ffffff;
            text-decoration: none;
            font-size: 16px;
            border: 1px solid #b026ff;
            padding: 8px 18px;
            border-radius: 6px;
            transition: background 0.2s ease, color 0.2s ease;
        }
        .home-btn:hover {
            background-color: #b026ff;
            color: #ffffff;
        }
    </style>
</head>
<body>

    <div class="game-card">
        <h1>Bear with a Backpack</h1>

        <!-- Dynamic Stats Display -->
        <div class="stats-bar">
            <span>❤️ Health: <span id="healthDisplay">3</span>/3</span>
            <span>🔋 Hunger: <span id="hungerDisplay">3</span>/5</span>
        </div>

        <!-- Dynamic Backpack Display -->
        <div class="inventory-bar">
            🎒 <strong>Backpack:</strong> <span id="inventoryDisplay">Empty</span>
        </div>
        
        <p id="story-text">Hello and welcome to the forest! You are new to these woods. What is your name?</p>
        
        <div id="interactive-area">
            <input type="text" id="userInput" placeholder="Enter your name...">
            <br>
            <button onclick="submitName()">Submit</button>
        </div>
    </div>

    <!-- Home Page Button -->
    <a href="index.html" class="home-btn">← Back to Arcade</a>

    <script>
        // Player Stats & Inventory
        let health = 3;
        let hunger = 3;
        let playerName = "";
        let playerLocation = "";
        let inventory = [];

        function updateUI() {
            document.getElementById('healthDisplay').innerText = health;
            document.getElementById('hungerDisplay').innerText = hunger;
            
            const invDisplay = document.getElementById('inventoryDisplay');
            if (inventory.length === 0) {
                invDisplay.innerText = "Empty";
            } else {
                invDisplay.innerText = inventory.join(", ");
            }
        }

        function checkGameOver() {
            if (health <= 0) {
                document.getElementById('story-text').innerText = "💀 You ran out of health and collapsed in the woods... GAME OVER!";
                document.getElementById('interactive-area').innerHTML = `<button onclick="location.reload()">Try Again</button>`;
                return true;
            }
            return false;
        }

        function submitName() {
            const input = document.getElementById('userInput').value;
            playerName = input.trim() !== "" ? input : "Bear";
            
            document.getElementById('story-text').innerText = "That's a nice name, but all I heard was GRRRRR.\n\nWhere are you from?";
            
            const interactiveArea = document.getElementById('interactive-area');
            interactiveArea.innerHTML = `
                <input type="text" id="userInput" placeholder="Enter location...">
                <br>
                <button onclick="submitLocation()">Submit</button>
            `;
        }

        function submitLocation() {
            document.getElementById('story-text').innerText = "So what I'm getting is, your name is GRRRRR and you are from INCOMPREHENSIBLE GROWL.\n\nYou stand at a crossroads in the forest. Which way do you want to head?";
            
            showMainChoices();
        }

        function showMainChoices() {
            if (checkGameOver()) return;

            const interactiveArea = document.getElementById('interactive-area');
            interactiveArea.innerHTML = `
                <button onclick="goLeft()">Walk Left ⬅️</button>
                <button onclick="goRight()">Walk Right ➡️</button>
            `;
        }

        // --- LEFT PATH BRANCHES ---
        function goLeft() {
            document.getElementById('story-text').innerText = "You venture down the left path into dense trees. What do you search for?";
            
            const interactiveArea = document.getElementById('interactive-area');
            interactiveArea.innerHTML = `
                <button onclick="inspectApple()">Look for an Apple 🍎</button>
                <button onclick="encounterKnight()">Challenge the Knight ⚔️</button>
                <button onclick="showMainChoices()">Back to Crossroads 🔙</button>
            `;
        }

        function inspectApple() {
            const isGoodApple = Math.random() < 0.5;

            if (isGoodApple) {
                health = Math.min(3, health + 1);
                hunger = Math.min(5, hunger + 1);
                updateUI();
                document.getElementById('story-text').innerText = "You find a juicy red apple! You eat it happily.\n\n❤️ Health +1 | 🔋 Hunger +1";
            } else {
                if (!inventory.includes("Worm")) {
                    inventory.push("Worm");
                }
                updateUI();
                document.getElementById('story-text').innerText = "You find an apple, but it's full of wriggling worms! You break off a worm and put it in your backpack.";
            }

            const interactiveArea = document.getElementById('interactive-area');
            interactiveArea.innerHTML = `<button onclick="goLeft()">Continue Left</button>`;
        }

        function encounterKnight() {
            document.getElementById('story-text').innerText = "A shiny knight steps out from behind an oak tree! 'Halt, Bear!' he yells, drawing his sword.";
            
            const interactiveArea = document.getElementById('interactive-area');
            interactiveArea.innerHTML = `
                <button onclick="fightKnight()">Fight the Knight 🐻</button>
                <button onclick="goLeft()">Run Away 🏃</button>
            `;
        }

        function fightKnight() {
            const playerWins = Math.random() < 0.5;

            if (playerWins) {
                if (!inventory.includes("String")) {
                    inventory.push("String");
                }
                updateUI();
                document.getElementById('story-text').innerText = "ROAR! You let out a mighty growl and charge! The terrified knight runs away, dropping a piece of String on the ground. You put the String in your backpack.";
            } else {
                health -= 1;
                updateUI();
                if (checkGameOver()) return;
                document.getElementById('story-text').innerText = "The knight strikes you with the flat of his blade! You take damage before backing off.\n\n❤️ Health -1";
            }

            const interactiveArea = document.getElementById('interactive-area');
            interactiveArea.innerHTML = `<button onclick="goLeft()">Continue Left</button>`;
        }

        // --- RIGHT PATH BRANCHES ---
        function goRight() {
            document.getElementById('story-text').innerText = "You trek down the right path toward the river sound. What do you do?";
            
            const interactiveArea = document.getElementById('interactive-area');
            interactiveArea.innerHTML = `
                <button onclick="stepInTrap()">Explore the Bushes 🌿</button>
                <button onclick="findStick()">Search for a Stick 🪵</button>
                <button onclick="visitLake()">Head to the Lake 🌊</button>
                <button onclick="showMainChoices()">Back to Crossroads 🔙</button>
            `;
        }

        function stepInTrap() {
            health -= 1;
            updateUI();
            if (checkGameOver()) return;

            document.getElementById('story-text').innerText = "SNAP! You step directly into a hidden bear trap!\n\n❤️ Health -1";
            
            const interactiveArea = document.getElementById('interactive-area');
            interactiveArea.innerHTML = `<button onclick="goRight()">Continue Right</button>`;
        }

        function findStick() {
            if (!inventory.includes("Stick")) {
                inventory.push("Stick");
                updateUI();
                document.getElementById('story-text').innerText = "You find a sturdy, flexible tree branch on the path and tuck the Stick into your backpack!";
            } else {
                document.getElementById('story-text').innerText = "
