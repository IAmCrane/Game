<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <style>
        body {
            background-color: #121212;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            padding: 50px 20px;
        }
        .game-card {
            max-width: 500px;
            margin: 0 auto;
            border: 2px solid #00ff66;
            padding: 30px;
            border-radius: 12px;
            background-color: #000000;
            box-shadow: 0 0 15px rgba(0, 255, 102, 0.2);
        }
        button {
            background-color: #00ff66;
            color: #000;
            border: none;
            padding: 12px 20px;
            font-size: 16px;
            font-weight: bold;
            margin: 8px;
            cursor: pointer;
            border-radius: 6px;
        }
        button:hover { background-color: #00cc52; }
        .score-board {
            margin-top: 20px;
            font-size: 18px;
            color: #ffffff;
        }
        .back-link {
            display: inline-block;
            margin-top: 25px;
            color: #ffffff;
            text-decoration: none;
        }
    </style>
</head>
<body>

    <div class="game-card">
        <h1>Rock, Paper, Scissors</h1>
        <p>Choose your move against the computer!</p>

        <div>
            <button onclick="play('Rock')">✊ Rock</button>
            <button onclick="play('Paper')">✋ Paper</button>
            <button onclick="play('Scissors')">✌️ Scissors</button>
        </div>

        <p id="result" style="font-size: 18px; margin-top: 20px;"></p>

        <div class="score-board">
            Score — You: <span id="playerScore">0</span> | Computer: <span id="compScore">0</span>
        </div>
    </div>

    <br>
    <a href="index.html" class="back-link">← Back to Arcade</a>

    <script>
        let playerScore = 0;
        let compScore = 0;
        const choices = ['Rock', 'Paper', 'Scissors'];

        function play(playerChoice) {
            const compChoice = choices[Math.floor(Math.random() * 3)];
            let resultText = `You picked ${playerChoice}, Computer picked ${compChoice}. `;

            if (playerChoice === compChoice) {
                resultText += "It's a tie!";
            } else if (
                (playerChoice === 'Rock' && compChoice === 'Scissors') ||
                (playerChoice === 'Paper' && compChoice === 'Rock') ||
                (playerChoice === 'Scissors' && compChoice === 'Paper')
            ) {
                resultText += "You win this round! 🎉";
                playerScore++;
            } else {
                resultText += "Computer wins this round! 🤖";
                compScore++;
            }

            document.getElementById('result').innerText = resultText;
            document.getElementById('playerScore').innerText = playerScore;
            document.getElementById('compScore').innerText = compScore;
        }
    </script>

</body>
</html>
